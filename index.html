<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Programmkompass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky control deck on top, then one of three views (Jetzt-Liste, Zeitraster mit fixierter Senderspalte, 20:15-Abendübersicht); Details als Seitenleiste bzw. Bottom-Sheet. */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --surface2:#e7eaf1; --ink:#141821; --muted:#596175; --line:#d6dae4;
  --accent:#2445d6; --accent-soft:#e3e8ff; --accent-ink:#ffffff;
  --live:#d9342a; --pay:#8a6106; --pay-bg:#fbefcf; --ok:#1f7a4d;
  --shadow:0 10px 30px rgba(20,24,33,.14);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --chw:176px; --rowh:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1016; --surface:#161922; --surface2:#1e2230; --ink:#eceef5; --muted:#99a0b3; --line:#2a2f3e;
  --accent:#8199ff; --accent-soft:#232a4a; --accent-ink:#0e1016;
  --live:#ff5c50; --pay:#e8bd52; --pay-bg:#2d2511; --ok:#4fc58b; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1016; --surface:#161922; --surface2:#1e2230; --ink:#eceef5; --muted:#99a0b3; --line:#2a2f3e;
  --accent:#8199ff; --accent-soft:#232a4a; --accent-ink:#0e1016;
  --live:#ff5c50; --pay:#e8bd52; --pay-bg:#2d2511; --ok:#4fc58b; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Deck */
.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px 8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:28px;letter-spacing:-.01em;margin:0;line-height:1}
.brand .clock{font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--live);display:flex;align-items:center;gap:6px}
.brand .clock::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.brand .clock::before{animation:none}}
.search{position:relative;flex:1 1 260px;max-width:420px}
.search input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:var(--muted)}
.tbtn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.tbtn:hover{border-color:var(--accent)}
.tbtn .n{font-family:var(--f-mono);font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 7px}
.row2{display:flex;align-items:center;gap:12px;padding-block:4px 10px;flex-wrap:wrap}
.tabs{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto}
.days::-webkit-scrollbar{display:none}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 10px;line-height:1.15;text-align:left;white-space:nowrap}
.days button b{display:block;font-size:13px}
.days button span{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days button[aria-pressed="true"] span{color:inherit;opacity:.75}
.days[aria-disabled="true"]{opacity:.4;pointer-events:none}
.filters{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-block:0 12px;scrollbar-width:thin}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-weight:700;font-size:13px;white-space:nowrap;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.sep{width:1px;height:24px;background:var(--line);flex:none}

/* Common bits */
main{padding-block:16px 40px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);margin-bottom:14px;max-width:80ch}
.note b{color:var(--ink)}
.logo{flex:none;width:44px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:13px;letter-spacing:.01em;color:#fff;line-height:1;text-align:center;padding:0 3px;overflow:hidden}
.badge{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.pay{background:var(--pay-bg);color:var(--pay);border-color:transparent}
.badge.live{background:var(--live);color:#fff;border-color:transparent}
.time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700}
.star{border:0;background:transparent;padding:4px;color:var(--muted);line-height:0;border-radius:6px}
.star[aria-pressed="true"]{color:#e0a106}
.star svg{width:18px;height:18px}
.empty{padding:40px 0;color:var(--muted);text-align:center}
.sectionhead{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:20px;margin:22px 0 10px;display:flex;align-items:baseline;gap:10px}
.sectionhead small{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted);font-stretch:100%}

/* Jetzt */
.nowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.nowcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:start;min-width:0}
.nowcard .chn{grid-column:2;display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);min-width:0}
.nowcard .chn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowcard .cur{grid-column:1/4;border:0;background:transparent;text-align:left;padding:0;min-width:0}
.nowcard .cur .tt{font-weight:700;font-size:16.5px;line-height:1.25;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nowcard .cur .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;margin-top:2px}
.bar{height:5px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.nowcard .nxt{grid-column:1/4;border:0;border-top:1px dashed var(--line);background:transparent;text-align:left;padding:8px 0 0;font-size:13.5px;color:var(--muted);display:flex;gap:8px;min-width:0}
.nowcard .nxt span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.nowcard button.cur:hover .tt,.nowcard button.nxt:hover span:last-child{color:var(--accent)}

/* Raster */
.gridbox{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:auto;height:max(440px,calc(100dvh - 250px));overscroll-behavior:contain}
.ginner{position:relative}
.ghead{position:sticky;top:0;z-index:6;display:flex;height:34px;background:var(--surface);border-bottom:1px solid var(--line)}
.ghead .corner{position:sticky;left:0;z-index:7;width:var(--chw);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px}
.ghead .corner button{border:1px solid var(--line);background:var(--surface2);border-radius:7px;font-size:12px;font-weight:700;padding:3px 8px}
.ticks{position:relative;flex:none}
.ticks span{position:absolute;top:0;height:34px;display:flex;align-items:center;padding-left:6px;font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--muted);border-left:1px solid var(--line)}
.ticks span.half{color:transparent;border-left-style:dotted}
.grow{display:flex;height:var(--rowh);border-bottom:1px solid var(--line)}
.gch{position:sticky;left:0;z-index:4;width:var(--chw);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 6px 0 8px;min-width:0}
.gch .nm{font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:1;min-width:0}
.gch .nm small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.track{position:relative;flex:none}
.pg{position:absolute;top:4px;bottom:4px;border-radius:8px;background:var(--surface2);border:1px solid transparent;padding:5px 8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.pg:hover{border-color:var(--accent)}
.pg .t{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.pg .n{font-weight:700;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg.past{opacity:.5}
.pg.on{background:var(--accent-soft);border-color:var(--accent)}
.pg.on .t{color:var(--accent)}
.pg.hit{outline:2px solid #e0a106}
.pg.prime{box-shadow:inset 3px 0 0 var(--accent)}
.pg.tiny{padding:4px 3px}
.pg.tiny .t{display:none}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--live);z-index:5;pointer-events:none}
.nowline::before{content:"";position:sticky;top:30px;display:block;width:10px;height:10px;margin-left:-4px;border-radius:50%;background:var(--live)}

/* 20:15 */
.primegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard .h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);min-width:0}
.pcard .h span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .tt{font-family:var(--f-display);font-stretch:82%;font-weight:800;font-size:19px;line-height:1.15;text-wrap:balance}
.pcard .sb{font-size:13px;color:var(--muted)}
.pcard .ds{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .fl{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tipps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tipp{background:var(--ink);color:var(--bg);border-radius:12px;padding:14px;border:0;text-align:left;display:flex;flex-direction:column;gap:6px}
.tipp .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.tipp .tt{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:20px;line-height:1.1;text-wrap:balance}
.tipp .sb{font-size:13px;opacity:.8}

/* Suche */
.results{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.res{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:left;min-width:0}
.res:hover{border-color:var(--accent)}
.res .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.res .tt small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}

/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:51;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dhead .x{margin-left:auto;border:1px solid var(--line);background:var(--surface2);border-radius:9px;width:36px;height:36px;font-size:18px;line-height:1}
.dbody{padding:18px 16px 28px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dbody h2{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.dbody .sub{color:var(--muted);margin-top:-6px}
.dbody .when{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.dbody p{margin:0;max-width:65ch}
.pimg{width:100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:var(--surface2)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.cta{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.mini{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:12px}
.mini h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.mini button{border:0;background:transparent;text-align:left;padding:6px 0;display:flex;gap:12px;font-size:14px;min-width:0}
.mini button span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini button:hover span:last-child{color:var(--accent)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.mitem .tt{min-width:0;border:0;background:transparent;text-align:left;padding:0}
.mitem .tt b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mitem .tt small{color:var(--muted)}
.mitem .rm{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:700;max-width:calc(100% - 32px)}

@media (max-width:640px){
  :root{--chw:104px;--rowh:62px}
  .brand h1{font-size:24px}
  .gch .logo{display:none}
  .nowgrid{grid-template-columns:1fr}
  .drawer{top:auto;width:100%;max-height:88dvh;border-radius:16px 16px 0 0;padding-left:env(safe-area-inset-left,0px)}
  .res{grid-template-columns:auto 1fr auto}
  .res .logo{display:none}
  .tbtn .lbl{display:none}
}
</style>

</head>
<body>
<div class="deck" id="deck">
  <div class="wrap">
    <div class="top">
      <div class="brand"><h1>Programmkompass</h1><span class="clock" id="clock">--:--</span></div>
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Sendung oder Sender suchen  ( / )" autocomplete="off" aria-label="Sendung oder Sender suchen">
      </label>
      <button class="tbtn" id="btnMerk" type="button" aria-label="Merkliste öffnen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span class="lbl">Merkliste</span><span class="n" id="merkN">0</span></button>
      <button class="tbtn" id="btnImport" type="button" title="XMLTV-Datei mit echten Programmdaten laden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg><span class="lbl">XMLTV laden</span></button>
      <input type="file" id="file" accept=".xml,.xmltv,text/xml,application/xml" hidden>
    </div>
    <div class="row2">
      <div class="tabs" role="tablist" aria-label="Ansicht">
        <button role="tab" data-view="jetzt" aria-selected="true">Jetzt</button>
        <button role="tab" data-view="raster" aria-selected="false">Raster</button>
        <button role="tab" data-view="prime" aria-selected="false">20:15</button>
      </div>
      <div class="days" id="days" aria-label="Tag wählen"></div>
    </div>
    <div class="filters" id="filters">
      <div class="seg" id="fCountry" aria-label="Land">
        <button data-v="all" aria-pressed="true">Alle</button><button data-v="DE">DE</button><button data-v="AT">AT</button><button data-v="CH">CH</button>
      </div>
      <div class="seg" id="fRecv" aria-label="Empfang">
        <button data-v="all" aria-pressed="true">Alle</button><button data-v="free">Free-TV</button><button data-v="pay">Pay-TV</button>
      </div>
      <span class="sep"></span>
      <button class="chip" id="fFav" aria-pressed="false">★ Favoriten</button>
      <span id="fCats" style="display:contents"></span>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>
<div id="layer"></div>

<script>
(()=>{
"use strict";
/* ---------- Storage ---------- */
const store={get(k,d){try{const v=localStorage.getItem("pk."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("pk."+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Sender (id, Name, Kürzel, Land, Pay, Kategorie, Farbe, Profil) ---------- */
const CAT={oer:"Öffentlich-rechtlich",privat:"Privat",news:"Nachrichten",sport:"Sport",film:"Film & Serie",doku:"Doku & Wissen",kinder:"Kinder",musik:"Musik & Sonstiges",regional:"Regional"};
const RAW=[
// Deutschland – öffentlich-rechtlich
["ard","Das Erste","ARD","DE",0,"oer","#003480","pubmain"],
["zdf","ZDF","ZDF","DE",0,"oer","#f27c00","pubmain"],
["3sat","3sat","3sat","DE AT CH",0,"oer","#c4003c","culture"],
["arte","arte","arte","DE",0,"oer","#e2481c","culture"],
["phoenix","phoenix","phx","DE",0,"oer","#1b5aa6","docnews"],
["ts24","tagesschau24","ts24","DE",0,"news","#0d2c6c","news"],
["zdfneo","ZDFneo","neo","DE",0,"oer","#4d7a1f","series"],
["zdfinfo","ZDFinfo","info","DE",0,"doku","#00658f","doku"],
["one","ONE","ONE","DE",0,"oer","#c2185b","series"],
["alpha","ARD alpha","alpha","DE",0,"doku","#3b4c9b","doku"],
["kika","KiKA","KiKA","DE",0,"kinder","#7cb518","kids"],
["br","BR Fernsehen","BR","DE",0,"regional","#0063b4","regional"],

  const prof=POOLS[ch.p]||POOLS.series;const out=[];
  const poolFor=b=>prof.all||prof[b]||prof.day;
  let anchors=(ANCH[ch.id]||[]).filter(a=>!a[4]||a[4].includes(dow)).map(a=>({s:m(a[0]),item:[a[1],a[2],a[3],a[5]]}));
  // Sport-Tage: Bundesliga am Wochenende, Champions League Di/Mi
  if(ch.p==="sportbl"&&(dow===6))anchors.push({s:m("15:30"),item:["Fußball: Bundesliga","Sport",150,"sp:bl"]},{s:m("18:30"),item:["Fußball: Bundesliga","Sport",140,"sp:bl"]});
  if((ch.id==="dazn1"||ch.id==="sstop")&&(dow===2||dow===3))anchors.push({s:m("21:00"),item:["Fußball: UEFA Champions League","Sport",120,"sp:cl"]});
  if(ch.id==="orf1"&&(dow===2||dow===3))anchors.push({s:m("20:15"),item:["Fußball: UEFA Champions League","Sport",150,"sp:cl"]});
  anchors.sort((a,b)=>a.s-b.s);
  const hasPrimeAnchor=anchors.some(a=>a.s===m("20:15"));
  const primeSoft=!prof.block&&!prof.all?m("20:15"):(["cinema","film","series","romance","heimat","crime","premium","culture","doku"].includes(ch.p)?m("20:15"):null);
  let t=0,last="";
  while(t<1440){
    const nextA=anchors.find(a=>a.s>=t);
    if(nextA&&nextA.s===t){const it=nextA.item;out.push(makeProg(ch,it,addMin(d0,t),it[2],r,bandOf(t),key));t+=it[2];last=it[0];anchors=anchors.filter(a=>a!==nextA&&a.s>=t);continue}
    let limit=nextA?nextA.s:1440;
    if(primeSoft!=null&&!hasPrimeAnchor&&t<primeSoft&&limit>primeSoft)limit=primeSoft;
    const band=bandOf(t);const pool=poolFor(band);
    let it=pick(r,pool),tries=0;while(it[0]===last&&pool.length>1&&tries++<4)it=pick(r,pool);
    let dur=it[2];
    const gap=limit-t;
    if(dur>gap){
      if(gap<5&&out.length){const p=out[out.length-1];p.end=addMin(p.end,gap);t=limit;continue}
      if(gap<=30){const s=pick(r,SHORT);it=[s[0],s[1],gap];dur=gap}else{dur=gap}
    }
    const prog=makeProg(ch,it,addMin(d0,t),dur,r,band,key);
    if(it[3]&&it[3][0]==="f"){ // Filmlänge an Film anpassen
      const f=FILMS.find(x=>x[0]===prog.title);if(f){let fd=Math.ceil((f[4]+10)/5)*5;fd=Math.min(fd,gap);if(fd>=60){dur=fd;prog.end=addMin(prog.start,dur)}}
    }
    out.push(prog);t+=dur;last=it[0];
  }
  return out;
}
function schedule(ch,key){
  const k=ch.id+key;if(cache.has(k))return cache.get(k);
  let list;
  if(imported.has(ch.id)){const s=dayStart(key),e=addMin(s,1440);list=imported.get(ch.id).filter(p=>p.end>s&&p.start<e)}
  else if(ch.importedOnly)list=[];
  else list=generate(ch,key);
  cache.set(k,list);return list;
}
function progAt(ch,date){const key=broadcastKey(date);const l=schedule(ch,key);const i=l.findIndex(p=>p.start<=date&&p.end>date);return i<0?{cur:null,next:l.find(p=>p.start>date)||null}:{cur:l[i],next:l[i+1]||schedule(ch,addDays(key,1))[0]}}
function findProg(id){const[chId,key]=id.split("|");const ch=CHANNELS.find(c=>c.id===chId);if(!ch)return null;return schedule(ch,key).find(p=>p.id===id)||null}

/* ---------- Ansicht: Jetzt ---------- */
function renderJetzt(chs){

    return`<div class="nowcard">${logo(c)}<div class="chn"><span>${esc(c.name)}</span>${chMeta(c)}</div>${starBtn(c)}
      <button class="cur" data-p="${esc(cur.id)}"><span class="tt">${esc(cur.title)}</span>
        <span class="meta"><span class="time">${hm(cur.start)}–${hm(cur.end)}</span><span>${esc(cur.genre)}</span><span>noch ${left} Min.</span>${cur.flags.includes("Live")?'<span class="badge live">LIVE</span>':""}</span>

function noteText(){

  return n?`<span><b>Echte Programmdaten für ${n} Sender${S.stand?", Stand "+S.stand:""}.</b> Sender mit dem Hinweis „Beispiel“ haben keine Datenquelle und zeigen ein generiertes Programm.</span>`
   :`<span><b>Beispielprogramm.</b> Die Sendungen sind generiert, damit du die Bedienung testen kannst. Echte Daten lädst du über „XMLTV laden“ (z.&nbsp;B. eine Datei aus deinem Receiver, Plex, Kodi oder einem EPG-Dienst).</span>`;

/* ---------- Ansicht: Raster ---------- */
let PPM=4;
function renderRaster(chs){
  PPM=innerWidth<640?3:4;
  const d0=dayStart(S.day),W=1440*PPM,q=S.q.toLowerCase();
  let ticks="";for(let i=0;i<48;i++){const d=addMin(d0,i*30);ticks+=`<span class="${i%2?"half":""}" style="left:${i*30*PPM}px;width:${30*PPM}px">${i%2?"":hm(d)}</span>`}
  const now=new Date();
  const rows=chs.map(c=>{
    const blocks=schedule(c,S.day).map(p=>{
      const s=Math.max(0,(p.start-d0)/6e4),e=Math.min(1440,(p.end-d0)/6e4);const w=(e-s)*PPM;if(w<=0)return"";
      const cls=["pg",p.end<=now?"past":"",p.start<=now&&p.end>now?"on":"",q.length>1&&p.title.toLowerCase().includes(q)?"hit":"",hm(p.start)==="20:15"?"prime":"",w<70?"tiny":""].join(" ");
      return`<button class="${cls}" style="left:${s*PPM+1}px;width:${w-2}px" data-p="${esc(p.id)}" title="${esc(hm(p.start)+" "+p.title)}"><span class="t">${hm(p.start)}</span><span class="n">${esc(p.title)}</span></button>`}).join("");
    return`<div class="grow"><div class="gch">${logo(c)}<span class="nm">${esc(c.name)}<small>${imported.size&&!imported.has(c.id)?"Beispiel · ":""}${c.pay?"Pay-TV · ":""}${c.countries.join("·")}</small></span></div><div class="track" style="width:${W}px">${blocks}</div></div>`}).join("");
  const nowOff=(now-d0)/6e4;
  const line=nowOff>=0&&nowOff<=1440?`<div class="nowline" id="nowline" style="left:calc(var(--chw) + ${nowOff*PPM}px)"></div>`:"";
  return`<div class="note">${noteText()}</div><div class="gridbox" id="gridbox"><div class="ginner" style="width:calc(var(--chw) + ${W}px)">
    <div class="ghead"><div class="corner"><button data-jump="now">Jetzt</button><button data-jump="prime">20:15</button></div><div class="ticks" style="width:${W}px">${ticks}</div></div>
    ${rows||'<p class="empty">Keine Sender für diese Filter.</p>'}${line}</div></div>`;
}
function jump(where){
  const box=$("#gridbox");if(!box)return;const d0=dayStart(S.day);let t;
  if(where==="now"){t=(new Date()-d0)/6e4;if(t<0||t>1440)t=m("20:15")}else t=m(where==="prime"?"20:15":where);
  box.scrollTo({left:Math.max(0,t*PPM-60),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}

/* ---------- Ansicht: 20:15 ---------- */
function renderPrime(chs){
  const at=addMin(dayStart(S.day),m("20:15")+5);

  const tipps=[...items].filter(x=>(!imported.size||imported.has(x.c.id))&&!["Nachrichten","Shopping","Wetter","Musik"].includes(x.p.genre)).sort((a,b)=>score(b)-score(a)).slice(0,4);

/* ---------- Suche ---------- */
function renderSearch(chs){
  const q=S.q.toLowerCase();const res=[];const now=new Date();
  const chHits=CHANNELS.filter(c=>c.name.toLowerCase().includes(q));
  const keys=[S.view==="jetzt"?today():S.day];if(keys[0]===today())keys.push(addDays(today(),1));
  for(const c of chs)for(const k of keys)for(const p of schedule(c,k))if(p.end>now&&(p.title.toLowerCase().includes(q)||p.sub.toLowerCase().includes(q)))res.push({c,p});
  res.sort((a,b)=>a.p.start-b.p.start);

}

/* ---------- XMLTV-Import ---------- */
const norm=s=>s.toLowerCase().replace(/\b(hd|uhd|fhd|sd|deutschland|germany|österreich|austria|schweiz|switzerland|\(de\)|\(at\)|\(ch\))\b/g,"").replace(/[^a-z0-9äöüß+]/g,"");
function parseXT(s){const mt=s.match(/^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)?\s*([+-]\d{4})?/);if(!mt)return null;const[_,y,mo,d,h,mi,se,tz]=mt;
  if(tz){const sign=tz[0]==="-"?-1:1;const off=sign*(+tz.slice(1,3)*60+ +tz.slice(3));return new Date(Date.UTC(+y,mo-1,+d,+h,+mi,+(se||0))-off*6e4)}return new Date(+y,mo-1,+d,+h,+mi,+(se||0))}
function importXML(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror"))throw new Error("Die Datei ist kein gültiges XML.");
  const map=new Map();const byNorm=new Map(CHANNELS.map(c=>[norm(c.name),c]));CHANNELS.forEach(c=>byNorm.set(norm(c.short),byNorm.get(norm(c.short))||c));
  let added=0;
  doc.querySelectorAll("channel").forEach(el=>{const xid=el.getAttribute("id");const names=[...el.querySelectorAll("display-name")].map(n=>n.textContent.trim());
    let c=CHANNELS.find(x=>x.id===xid)||null;if(!c)for(const n of names.concat([xid])){c=byNorm.get(norm(n||""));if(c)break}
    if(!c){c={id:"x_"+hash(xid).toString(36),name:names[0]||xid,short:(names[0]||xid).slice(0,5),countries:["DE"],pay:false,cat:"musik",color:"#556",p:"series",importedOnly:true};CHANNELS.push(c);added++}
    map.set(xid,c)});
  const progs=new Map();let n=0;
  doc.querySelectorAll("programme").forEach(el=>{const c=map.get(el.getAttribute("channel"));if(!c)return;const st=parseXT(el.getAttribute("start")||""),en=parseXT(el.getAttribute("stop")||"");if(!st)return;
    const txt=sel=>{const x=el.querySelector(sel);return x?x.textContent.trim():""};
    const rating=txt("rating value");const cat=txt("category");const epn=[...el.querySelectorAll("episode-num")].find(x=>x.getAttribute("system")==="onscreen");const ic=el.querySelector("icon");let sub=txt("sub-title");if(!sub&&epn){const mm=epn.textContent.match(/S(\d+)E(\d+)/);if(mm)sub="Staffel "+(+mm[1])+", Folge "+(+mm[2])}
    const p={noStop:!en,id:c.id+"|"+broadcastKey(st)+"|"+st.getTime(),ch:c.id,start:st,end:en||addMin(st,30),title:txt("title")||"Ohne Titel",sub,img:ic?ic.getAttribute("src").replace(/^http:/,"https:"):"",genre:cat||"Sendung",desc:txt("desc"),fsk:+(rating.match(/\d+/)||[0])[0],flags:[...(el.querySelector("premiere")?["Premiere"]:[]),...(el.querySelector("previously-shown")?["Wdh."]:[]),...(el.querySelector("new")?["Neu"]:[]),...(el.querySelector("subtitles")?["UT"]:[])],year:txt("date").slice(0,4)||undefined,country:txt("country"),src:"xmltv"};
    if(!progs.has(c.id))progs.set(c.id,[]);progs.get(c.id).push(p);n++});
  for(const[id,l]of progs){l.sort((a,b)=>a.start-b.start);for(let i=0;i<l.length-1;i++)if(l[i].noStop)l[i].end=l[i+1].start;imported.set(id,l)}
  cache.clear();
  return{channels:progs.size,programmes:n,added};
}

/* ---------- Ereignisse ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]");if(!t)return;
  if(t.dataset.close!==undefined){closeLayer();return}
  if(t.dataset.view){S.view=t.dataset.view;if(S.view==="jetzt")S.day=today();render();return}
  if(t.dataset.day){S.day=t.dataset.day;render();return}
  if(t.dataset.cat){const k=t.dataset.cat;S.cats.has(k)?S.cats.delete(k):S.cats.add(k);render(true);return}
  if(t.dataset.v){const seg=t.parentElement.id;if(seg==="fCountry")S.country=t.dataset.v;if(seg==="fRecv")S.recv=t.dataset.v;render(true);return}
  if(t.id==="fFav"){S.favOnly=!S.favOnly;render(true);return}
  if(t.dataset.fav){const id=t.dataset.fav;S.favs.has(id)?S.favs.delete(id):S.favs.add(id);render(true);return}
  if(t.dataset.p){openDetail(t.dataset.p);return}
  if(t.dataset.merk){const id=t.dataset.merk;toggleMerk(id);openDetail(id);return}
  if(t.dataset.unmerk){toggleMerk(t.dataset.unmerk);openMerk();return}
  if(t.dataset.jump){jump(t.dataset.jump);return}
  if(t.dataset.showch||t.dataset.gotoch){const id=t.dataset.showch||t.dataset.gotoch;closeLayer();S.view="raster";S.q="";$("#q").value="";S.cats.clear();S.country="all";S.recv="all";S.favOnly=false;render();
    requestAnimationFrame(()=>{const rows=[...document.querySelectorAll(".grow")];const idx=visibleChannels().findIndex(c=>c.id===id);if(idx>=0&&rows[idx]){const b=$("#gridbox");b.scrollTop=rows[idx].offsetTop-40;rows[idx].querySelector(".gch").style.background="var(--accent-soft)"}});return}
  if(t.id==="btnMerk"){openMerk();return}
  if(t.id==="btnImport"){$("#file").click();return}
});
$("#file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const res=importXML(r.result);toast(res.programmes?`${res.programmes} Sendungen für ${res.channels} Sender geladen${res.added?` (${res.added} neue Sender)`:""}.`:"In der Datei wurden keine Sendungen gefunden.");render()}catch(err){toast("Import fehlgeschlagen: "+err.message)}};
  r.onerror=()=>toast("Die Datei konnte nicht gelesen werden.");r.readAsText(f);e.target.value=""});
let qT;$("#q").addEventListener("input",e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();render(true)},180)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#layer").innerHTML){closeLayer();return}
  if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}
});

/* ---------- Uhr & Live-Aktualisierung ---------- */
function tick(){
  const now=new Date();$("#clock").textContent=hm(now);
  if(broadcastKey(now)!==tick.k){const was=tick.k;tick.k=broadcastKey(now);if(was){if(S.view==="jetzt")S.day=tick.k;render(true)}}
  checkReminders();
}
let lastMin=-1;
setInterval(()=>{tick();const mi=new Date().getMinutes();if(mi!==lastMin){lastMin=mi;if(!$("#layer").innerHTML&&document.activeElement!==$("#q")){if(S.view==="jetzt")render(true);else if(S.view==="raster"){const nl=$("#nowline");if(nl){const off=(new Date()-dayStart(S.day))/6e4;nl.style.left=`calc(var(--chw) + ${off*PPM}px)`}}}}},15000);
tick.k=broadcastKey(new Date());tick();lastMin=new Date().getMinutes();
async function autoLoad(){
  S.loading=true;render();
  try{const r=await fetch("guide.xml",{cache:"no-cache"});
    if(r.ok){const res=importXML(await r.text());const lm=r.headers.get("last-modified");
      if(lm){const d=new Date(lm);S.stand=fmtDay(d)+" "+hm(d)}}
  }catch(e){}
  S.loading=false;render(true);
}
if(location.protocol.startsWith("http"))autoLoad();else render();
})();
</script>
